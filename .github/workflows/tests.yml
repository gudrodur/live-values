# Runs this repo's own gates: the test suite, the bundle freshness check, and
# a self-check of this repo's docs against their registry. Hosted runners
# only; no secrets; nothing here needs machine, account or network access.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      # The bundle is built with Bun, pinned so every build is byte-identical.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Run tests
        run: node --test tests/*.test.mjs tests/lib/*.test.mjs
      - name: Gate - bundle fresh
        run: node build.mjs --check
      - name: Gate - this repo's docs match their sources
        run: node dist/live-values.mjs --check

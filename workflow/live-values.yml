# live-values: a number between live markers must equal what its registry
# query prints. Copied byte-identical into each adopting repo from the
# live-values release (dist/live-values.mjs beside this file's source, and
# this workflow); a copy-identity check keeps the copies identical. The engine
# beside it, scripts/live-values.mjs, is the generated bundle.
#
# Exit 1 is drift or a marker error; exit 3 is a query that could not run
# here, and fails too: a value nobody could check is not a clean one. The fix
# is `node scripts/live-values.mjs --write`, which the pre-commit hook runs
# on a machine with a hook runner installed.
name: live-values

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # No package-manager cache: the engine needs no dependencies, and a
      # cached setup step can fail the job in its post step when no store
      # path exists. The engine is dependency-free, so nothing is cached.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Live values match their sources
        run: node scripts/live-values.mjs --check
